<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0c10"/>
      <stop offset="50%" stop-color="#1a0910"/>
      <stop offset="100%" stop-color="#08090c"/>
    </linearGradient>
    <linearGradient id="cgiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11937"/>
      <stop offset="100%" stop-color="#ff3b56"/>
    </linearGradient>
  </defs>
  <rect width="480" height="320" rx="18" fill="url(#bgGrad)"/>
  <!-- Corner HUD brackets in CGI Red -->
  <g stroke="url(#cgiGrad)" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 20 46 L 20 20 L 46 20"/>
    <path d="M 434 20 L 460 20 L 460 46"/>
    <path d="M 20 274 L 20 300 L 46 300"/>
    <path d="M 434 300 L 460 300 L 460 274"/>
  </g>
  <!-- Official CGI Logo in Top-Left Badge -->
  <image href="/cgi-logo.png" x="28" y="24" width="84" height="39"/>
  <!-- Top-Right Status Pill -->
  <g transform="translate(356, 42)">
    <rect x="-85" y="-14" width="170" height="26" rx="13" fill="#14070b" fill-opacity="0.9" stroke="#e11937" stroke-width="1.5"/>
    <circle cx="-68" cy="-1" r="4.5" fill="#e11937"/>
    <text x="6" y="3" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" letter-spacing="1.8" text-anchor="middle">CGI · AI COMPANION</text>
  </g>
  <!-- Bottom Gemini badge -->
  <g transform="translate(240, 294)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" letter-spacing="1.8" text-anchor="middle">CGI.COM · POWERED BY GOOGLE GEMINI</text>
  </g>
</svg>
